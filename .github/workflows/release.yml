name: Build and Release Userscript

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # build.ts stamps @version from package.json, so a tag that disagrees
      # would publish a release whose userscript reports the wrong version and
      # never prompts installed users to update. Fail loudly instead.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(bun --print 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Typecheck and Lint
        run: bun run check

      - name: Build Userscript
        run: bun run build

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aistudio-folders.user.js
          draft: false
          prerelease: false
          generate_release_notes: true
